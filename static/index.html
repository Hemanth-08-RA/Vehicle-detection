<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VehicleVision AI - Real-Time Traffic Analytics & Vehicle Detection</title>
  
  <!-- Fonts: Inter, Outfit & Share Tech Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS v4 Play CDN -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

  <!-- Tailwind v4 Custom Theme Configuration -->
  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Outfit', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
      
      --color-brand-bg: #070B14;
      --color-brand-card: rgba(13, 19, 36, 0.75);
      --color-brand-card-border: rgba(255, 255, 255, 0.08);
      --color-brand-primary: #00F5FF;
      --color-brand-secondary: #3B82F6;
      --color-brand-accent: #8B5CF6;
      --color-brand-success: #10B981;
      --color-brand-warning: #F59E0B;
      --color-brand-danger: #F43F5E;
      
      --shadow-neon-cyan: 0 0 20px rgba(0, 245, 255, 0.25);
      --shadow-neon-emerald: 0 0 20px rgba(16, 185, 129, 0.25);
      --shadow-neon-rose: 0 0 20px rgba(244, 63, 94, 0.25);
      --shadow-neon-purple: 0 0 20px rgba(139, 92, 246, 0.25);
    }
  </style>

  <!-- Global Custom CSS (Glassmorphism, Ambient Orbs, Custom Scrollbars & Animations) -->
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      background-color: #070B14;
      color: #F1F5F9;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Ambient Background Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.18;
      animation: float-orb 20s ease-in-out infinite alternate;
    }
    .orb-1 {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, #00F5FF 0%, #3B82F6 100%);
    }
    .orb-2 {
      bottom: -15%;
      right: -10%;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, #8B5CF6 0%, #F43F5E 100%);
      animation-delay: -10s;
    }
    .orb-3 {
      top: 40%;
      left: 35%;
      width: 35vw;
      height: 35vw;
      background: radial-gradient(circle, #10B981 0%, #00F5FF 100%);
      animation-delay: -5s;
    }

    @keyframes float-orb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 40px) scale(1.1); }
      100% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* Custom Cyber Grid Pattern */
    .bg-cyber-grid {
      background-size: 50px 50px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #070B14;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00F5FF;
    }

    /* Glassmorphism Panel */
    .glass-panel {
      background: rgba(13, 19, 36, 0.65);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-panel-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-panel-hover:hover {
      border-color: rgba(0, 245, 255, 0.3);
      box-shadow: 0 12px 40px 0 rgba(0, 245, 255, 0.12);
      transform: translateY(-2px);
    }

    /* Pulsing & Glow effects */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 2px #00F5FF); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #00F5FF); }
    }
    .live-pulse {
      animation: pulse-glow 1.8s infinite;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }
    .scanner-line {
      animation: scanline 3s linear infinite;
    }

    /* Shimmer Effect for Buttons */
    .btn-shimmer {
      position: relative;
      overflow: hidden;
    }
    .btn-shimmer::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent,
        rgba(255, 255, 255, 0.15),
        transparent
      );
      transform: rotate(30deg);
      transition: all 0.6s ease;
    }
    .btn-shimmer:hover::after {
      left: 100%;
    }
  </style>

  <!-- ESM Import Maps -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19?dev",
        "react-dom/client": "https://esm.sh/react-dom@19/client?dev",
        "htm": "https://esm.sh/htm@3"
      }
    }
  </script>
</head>
<body class="bg-brand-bg bg-cyber-grid min-h-screen antialiased selection:bg-brand-primary selection:text-brand-bg relative">
  <!-- Background Ambient Glow Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Mount root for React Application -->
  <div id="root" class="relative z-10"></div>

  <!-- React Entry Module -->
  <script type="module" src="./app.js"></script>
</body>
</html>
