services:
  - type: web
    name: vehicle-detection-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT main:app
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: WEBHOOK_URL
        value: "https://script.google.com/macros/s/AKfycbzj7Y3Cg858enguXSXuq1k7CtDGRxkOl9Q6wmachbQGN9GWDkBRYCGNDyAD-ReHnVu2/exec"
